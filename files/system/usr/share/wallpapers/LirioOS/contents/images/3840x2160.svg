      <stop offset="0" stop-color="#f4ecff"/>
      <stop offset="0.55" stop-color="#c9a8f0"/>
      <stop offset="1" stop-color="#5d3a9b"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
